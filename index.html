<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Fabrik Simulation - Kupfer-Fix</title>
  <style>
    body { font-family: sans-serif; background: #1e1e24; color: #fff; margin: 20px; }
    #grid { display: grid; grid-template-columns: repeat(8, 60px); gap: 4px; margin-bottom: 20px; }
    .cell { width: 60px; height: 60px; background: #2a2a32; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; text-align: center; cursor: pointer; user-select: none; }
    .cell.ore { background: #8c4a27; }
    .cell.building { background: #3a5a80; }
    .controls { margin-bottom: 15px; }
    button { padding: 8px 12px; margin-right: 5px; background: #444; color: white; border: none; cursor: pointer; }
    button.active { background: #007acc; }
    #log { background: #111; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #333; }
  </style>
</head>
<body>

  <h1>Fabrik-Automatisierung</h1>
  <div class="controls">
    <button onclick="selectTool('mine')">Erzmine platzieren</button>
    <button onclick="selectTool('schmelze')">Schmelze platzieren (Barren)</button>
    <button onclick="selectTool('fabrik')">Fabrik platzieren (Wire)</button>
    <button onclick="selectTool('clear')">Abreißen</button>
  </div>

  <div id="grid"></div>
  <h3>System-Log / Inventar</h3>
  <div id="log"></div>

  <script>
    const GRID_SIZE = 8;
    let selectedTool = 'mine';
    const gridData = [];

    const RECIPES = {
      kupferbarren: { name: 'Kupferbarren', input: 'kupfererz', inputQty: 1, output: 'kupferbarren', outputQty: 1, time: 2000 },
      kupferwire: { name: 'Kupferwire', input: 'kupferbarren', inputQty: 1, output: 'kupferwire', outputQty: 2, time: 1500 }
    };

    // Grid initialisieren
    const gridEl = document.getElementById('grid');
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const isOreNode = (r === 1 && c === 1); // Erzfeld bei (1,1)
        const cellData = {
          r, c,
          type: isOreNode ? 'ore' : 'empty',
          building: null,
          inputBuffer: {},
          outputBuffer: {},
          progress: 0,
          isCrafting: false
        };
        gridData.push(cellData);

        const div = document.createElement('div');
        div.className = 'cell' + (isOreNode ? ' ore' : '');
        div.dataset.index = gridData.length - 1;
        div.onclick = () => handleCellClick(cellData, div);
        gridEl.appendChild(div);
      }
    }

    function selectTool(tool) {
      selectedTool = tool;
    }

    function handleCellClick(cell, el) {
      if (selectedTool === 'clear') {
        cell.building = null;
        cell.inputBuffer = {};
        cell.outputBuffer = {};
        cell.isCrafting = false;
      } else if (selectedTool === 'mine' && cell.type === 'ore') {
        cell.building = 'mine';
      } else if (selectedTool === 'schmelze' && cell.type === 'empty') {
        cell.building = 'schmelze';
      } else if (selectedTool === 'fabrik' && cell.type === 'empty') {
        cell.building = 'fabrik';
      }
      render();
    }

    // Simulations-Loop (alle 100ms)
    setInterval(() => {
      let logText = "";

      gridData.forEach((cell, idx) => {
        if (!cell.building) return;

        // 1. Mine produziert Erz
        if (cell.building === 'mine') {
          cell.progress += 100;
          if (cell.progress >= 1000) {
            cell.outputBuffer['kupfererz'] = (cell.outputBuffer['kupfererz'] || 0) + 1;
            cell.progress = 0;
          }
        }

        // 2. Automatischer Transport zum nächsten Feld (rechts)
        const nextCell = gridData[idx + 1];
        if (nextCell && nextCell.building) {
          for (let item in cell.outputBuffer) {
            if (cell.outputBuffer[item] > 0) {
              cell.outputBuffer[item]--;
              nextCell.inputBuffer[item] = (nextCell.inputBuffer[item] || 0) + 1;
            }
          }
        }

        // 3. Verarbeitung in Schmelze / Fabrik
        let recipe = null;
        if (cell.building === 'schmelze') recipe = RECIPES.kupferbarren;
        if (cell.building === 'fabrik') recipe = RECIPES.kupferwire;

        if (recipe) {
          if (!cell.isCrafting && (cell.inputBuffer[recipe.input] || 0) >= recipe.inputQty) {
            cell.inputBuffer[recipe.input] -= recipe.inputQty;
            cell.isCrafting = true;
            cell.progress = 0;
          }

          if (cell.isCrafting) {
            cell.progress += 100;
            if (cell.progress >= recipe.time) {
              cell.outputBuffer[recipe.output] = (cell.outputBuffer[recipe.output] || 0) + recipe.outputQty;
              cell.isCrafting = false;
              cell.progress = 0;
            }
          }
        }

        // Status im Log anzeigen
        logText += `[Cell ${cell.r},${cell.c} - ${cell.building.toUpperCase()}] In: ${JSON.stringify(cell.inputBuffer)} | Out: ${JSON.stringify(cell.outputBuffer)}<br>`;
      });

      document.getElementById('log').innerHTML = logText || "Keine aktiven Gebäude.";
      render();
    }, 100);

    function render() {
      const cells = document.querySelectorAll('.cell');
      gridData.forEach((data, i) => {
        const el = cells[i];
        if (data.type === 'ore' && !data.building) {
          el.innerText = "Kupfer-Erzfeld";
        } else if (data.building) {
          el.innerText = `${data.building.toUpperCase()}\nIn:${Object.values(data.inputBuffer).reduce((a,b)=>a+b,0)}\nOut:${Object.values(data.outputBuffer).reduce((a,b)=>a+b,0)}`;
        } else {
          el.innerText = "";
        }
      });
    }
  </script>
</body>
</html>
